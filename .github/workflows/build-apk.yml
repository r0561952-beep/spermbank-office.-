name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать архив с игрой
        run: |
          Z=$(ls *.zip | head -n 1)
          unzip -q -o "$Z" -d /tmp/proj
          cp -r /tmp/proj/*/. .
          ls -la

      - name: Собрать игру (JavaScript)
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Собрать APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SPERMbank-Office.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SPERMbank-Office-APK
          path: SPERMbank-Office.apk

      - name: Выложить APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "build-${{ github.run_number }}" SPERMbank-Office.apk --title "СПЕРМбанк Офис — сборка ${{ github.run_number }}" --notes "Скачай SPERMbank-Office.apk и установи на Android." --latest
